apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-cluster-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
data:
  storage-and-resources.json: |
    {
      "dashboard": {
        "title": "Cluster Storage & Resource Overview",
        "panels": [
          {
            "type": "timeseries",
            "title": "Persistent Volume Claim (PVC) Usage Space",
            "targets": [
              {
                "expr": "kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes * 100",
                "legendFormat": "{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }}"
              }
            ]
          }
        ]
      }
    }